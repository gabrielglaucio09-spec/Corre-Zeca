<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Corre, Zeca!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700&display=swap">
<style>
:root { --accent: #ffd400; --fg: #eef6ec; --panel: #12403a; --green: #009c3b;
  --font-display: 'Bungee', 'Arial Black', Impact, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--fg);
  font-family: 'Nunito', system-ui, sans-serif; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
.app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
.stage { position: relative; width: min(100vw, calc(100vh * 640 / 352)); height: min(100vh, calc(100vw * 352 / 640)); line-height: 0; }
canvas { width: 100%; height: 100%; display: block; }
#overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2.2vh; padding: 3vh 4vw; text-align: center; line-height: 1.35; background: rgba(6, 28, 24, .86); overflow: auto; }
#overlay[hidden] { display: none; }
#overlay h2 { font-family: var(--font-display); font-weight: 400; margin: 0; font-size: clamp(1.2rem, 8vh, 2.4rem); color: var(--accent); }
#overlay p { margin: 0; max-width: 52ch; font-size: clamp(.7rem, 3.6vh, 1rem); }
#overlay .small { color: #9fc3b6; font-size: clamp(.65rem, 3vh, .9rem); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
button.main { font-family: var(--font-display); font-size: clamp(.9rem, 5vh, 1.25rem); background: var(--accent); color: #1b2a00;
  border: 0; border-radius: 6px; padding: 1.6vh 4vh; box-shadow: 0 4px 0 #a88a00; }
button.main.alt { background: #2a6b60; color: var(--fg); box-shadow: 0 4px 0 #17413a; }
button.main:active { transform: translateY(3px); box-shadow: 0 1px 0 #a88a00; }
.touch { position: fixed; inset: 0; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-end;
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.touch .grp { display: flex; gap: 14px; }
.touch button { pointer-events: auto; width: clamp(52px, 17vh, 76px); height: clamp(52px, 17vh, 76px); border-radius: 50%;
  border: 3px solid rgba(255,255,255,.35); background: rgba(24, 83, 75, .62); color: #fff; font-family: var(--font-display); font-size: 1.05rem; touch-action: none; }
.touch button.on { background: rgba(0, 156, 59, .85); }
.touch button.jump { background: rgba(122, 100, 0, .65); }
.touch button.jump.on { background: rgba(255, 212, 0, .9); color: #1b2a00; }

button.main:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.touch #bPause { width: 46px; height: 46px; font-size: .85rem; align-self: flex-start; margin-top: 8px; }

button.main:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.touch #bThrow { background: #3a8f4f; }
.touch #bPause { width: 46px; height: 46px; font-size: .85rem; align-self: flex-start; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="c" width="640" height="352"></canvas>
    <div id="overlay"></div>
  </div>
</div>
<div class="touch" id="touch">
  <div class="grp"><button id="bL" aria-label="Esquerda">&#9664;</button><button id="bR" aria-label="Direita">&#9654;</button></div>
  <div class="grp"><button id="bRun" aria-label="Correr">&raquo;</button><button id="bThrow" aria-label="Arremessar legume">B</button><button id="bJump" class="jump" aria-label="Pular">A</button></div>
</div>

var state = 'menu';
var levelIdx = 0, L = null, P = null, cam = 0, frame = 0, shakeT = 0, endT = 0;
var score = 0, lives = 3, coinCount = 0, timeLeft = 300, best = 0, islandScore = 0;
var particles = [], popups = [], bumps = {};
var keys = {}, jumpBuf = 0;
try { best = parseInt(localStorage.getItem('correzeca_best') || '0', 10) || 0; } catch (e) {}

function fmtTime(sec) { sec = Math.max(0, Math.floor(sec)); var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }

function newPlayer() {
  return { x: 64, y: 8 * TS + 2, w: 20, h: 30, vx: 0, vy: 0, dir: 1, ground: false, wasGround: false, coyote: 0, hearts: 3, inv: 0, anim: 0, dead: false, big: false, pow: false, cd: 0, star: 0, sx: 1, sy: 1 };
}
function loadLevel(i, keepBig, keepPow) {
  levelIdx = i; L = makeLevel(LEVELS[i], i); P = newPlayer(); L.veg = [];
  if (keepBig) { P.big = true; P.h = 44; P.y -= 14; P.pow = !!keepPow; }
  cam = 0; timeLeft = L.time; particles = []; popups = []; bumps = {}; shakeT = 0;
}

/* ---------- Salvar / carregar ---------- */
function saveGame() {
  try {
    localStorage.setItem('correzeca_save', JSON.stringify({ v: 1, level: levelIdx, cp: L && L.cp ? L.cp : 0, score: score, lives: lives, coins: coinCount, big: !!(P && P.big), pow: !!(P && P.pow), island: islandScore }));
  } catch (e) {}
}
function readSave() {
  try {
    var s = JSON.parse(localStorage.getItem('correzeca_save') || 'null');
    if (s && s.v === 1 && s.level >= 0 && s.level < LEVELS.length) return s;
  } catch (e) {}
  return null;
}
function clearSave() { try { localStorage.removeItem('correzeca_save'); } catch (e) {} }
function placeAtCheckpoint(cx) {
  P.x = cx + 4; P.inv = 90; cam = Math.max(0, Math.min(P.x - VW * 0.42, L.w * TS - VW));
  L.checks.forEach(function (c) { if (c.x <= cx) c.active = true; });
  L.cp = cx;
}
function loadGame() {
  var s = readSave();
  if (!s) { startGame(); return; }
  score = s.score || 0; lives = Math.max(1, s.lives || 3); coinCount = s.coins || 0; islandScore = s.island || 0;
  var boss = !!LEVELS[s.level].boss;
  loadLevel(s.level, !!s.big && !boss, !!s.pow);
  if (s.cp && !boss) placeAtCheckpoint(s.cp);
  state = 'play';
}

/* ---------- Telas ---------- */
function show(title, lines, label, fn, small, label2, fn2, disable2) {
  overlay.hidden = false;
  overlay.innerHTML = '';
  var h = document.createElement('h2'); h.textContent = title; overlay.appendChild(h);
  lines.forEach(function (t) { var p = document.createElement('p'); p.textContent = t; overlay.appendChild(p); });
  if (small) { var s = document.createElement('p'); s.className = 'small'; s.textContent = small; overlay.appendChild(s); }
  var row = document.createElement('div'); row.className = 'btns'; overlay.appendChild(row);
  function mk(text, f, alt, dis) {
    var b = document.createElement('button'); b.className = 'main' + (alt ? ' alt' : ''); b.textContent = text;
    if (dis) b.disabled = true;
    b.addEventListener('click', function () { initAudio(); sfx.click(); overlay.hidden = true; f(); });
    row.appendChild(b); return b;
  }
  var b1 = mk(label, fn, false);
  if (label2) mk(label2, fn2, true, disable2);
  setTimeout(function () { try { b1.focus({ preventScroll: true }); } catch (e) {} }, 30);
  return h;
}
function hide() { overlay.hidden = true; }

function menu() {
  state = 'menu';
  var h = show('Corre, Zeca!', [], 'Novo jogo', startGame, best ? 'Recorde: ' + best + ' pontos' : null, 'Carregar jogo', loadGame, !readSave());
  var img = new Image(); img.src = LOGO; img.alt = 'Corre, Zeca!';
  img.style.cssText = 'width:min(86%,440px);max-height:36vh;object-fit:contain';
  overlay.replaceChild(img, h);
}
function startGame() {
  score = 0; lives = 3; coinCount = 0; islandScore = 0; loadLevel(0); state = 'play'; saveGame();
}
function retryLevel() { lives = 3; loadLevel(levelIdx); state = 'play'; }
function nextLevel() {
  if (levelIdx + 1 >= LEVELS.length) { startEnding(); return; }
  var keep = P.big, keepPow = P.pow, newIsle = LEVELS[levelIdx + 1].island !== LEVELS[levelIdx].island;
  if (newIsle) lives = Math.min(lives + 1, 5);
  loadLevel(levelIdx + 1, keep, keepPow);
  if (newIsle) islandScore = score;
  state = 'play'; saveGame();
}
function saveBest() { if (score > best) { best = score; try { localStorage.setItem('correzeca_best', String(best)); } catch (e) {} } }

function startEnding() {
  saveBest(); clearSave(); state = 'ending'; endT = 0; hide(); particles = []; popups = [];
}

/* ---------- Entrada ---------- */
var map = { ArrowLeft: 'L', a: 'L', A: 'L', ArrowRight: 'R', d: 'R', D: 'R', ArrowUp: 'J', w: 'J', W: 'J', ' ': 'J', Shift: 'B', z: 'B', Z: 'B', b: 'T', B: 'T' };
window.addEventListener('keydown', function (e) {
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { togglePause(); return; }
  if (e.key === 'm' || e.key === 'M') { setMuted(!muted); return; }
  var k = map[e.key];
  if (k) {
    if (e.key === ' ' || e.key.indexOf('Arrow') === 0) e.preventDefault();
    if (k === 'J' && !keys.J) { jumpBuf = 7; initAudio(); }
    if (k === 'T' && !keys.T) throwVeg();
    keys[k] = true;
  }
  if ((e.key === 'Enter') && !overlay.hidden) { var b = overlay.querySelector('button'); if (b) b.click(); }
});
window.addEventListener('keyup', function (e) { var k = map[e.key]; if (k) keys[k] = false; });
window.addEventListener('blur', function () { keys = {}; if (state === 'play') togglePause(); });
function bindTouch(id, k) {
  var el = document.getElementById(id); if (!el) return;
  function on(e) { e.preventDefault(); if (k === 'J' && !keys.J) { jumpBuf = 7; initAudio(); } if (k === 'T' && !keys.T) throwVeg(); keys[k] = true; el.classList.add('on'); }
  function off(e) { e.preventDefault(); keys[k] = false; el.classList.remove('on'); }
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}
bindTouch('bL', 'L'); bindTouch('bR', 'R'); bindTouch('bRun', 'B'); bindTouch('bJump', 'J'); bindTouch('bThrow', 'T');
(function () {
  var el = document.getElementById('bPause'); if (!el) return;
  el.addEventListener('pointerdown', function (e) { e.preventDefault(); initAudio(); togglePause(); });
  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
function pauseScreen(saved) {
  var def = LEVELS[levelIdx];
  show('Pausado', [def.name + ' · Ilha ' + (def.island + 1), 'Pontos: ' + score + ' · Brigadeiros: ' + coinCount + ' · Vidas: ' + Math.max(lives, 0)],
    'Continuar', function () { state = 'play'; },
    saved ? 'Jogo salvo no último ponto de save.' : 'O jogo também é salvo automaticamente nos pontos de save.',
    'Salvar jogo', function () { saveGame(); pauseScreen(true); });
  var row = overlay.querySelector('.btns');
  function more(text, f) {
    var b = document.createElement('button'); b.className = 'main alt'; b.textContent = text;
    b.addEventListener('click', function () { initAudio(); sfx.click(); f(); });
    row.appendChild(b);
  }
  more(muted ? 'Ligar som' : 'Desligar som', function () { setMuted(!muted); pauseScreen(saved); });
  more('Menu principal', function () { overlay.hidden = true; menu(); });
  var ctl = document.createElement('p'); ctl.className = 'small';
  ctl.textContent = 'Setas/A D andar · Espaço pular · Shift correr · B arremessar legume · P pausa';
  overlay.appendChild(ctl);
}
function togglePause() {
  if (state === 'play') { state = 'pause'; pauseScreen(); }
  else if (state === 'pause') { hide(); state = 'play'; }
}

/* ---------- Utilidades ---------- */
function tileAt(tx, ty) { if (ty < 0) return 0; if (ty >= ROWS) return 0; if (tx < 0 || tx >= L.w) return 6; return L.grid[ty][tx]; }
function solidT(t) { return (t >= 1 && t <= 6) || t === 8 || t === 9; }
function solidAt(px, py) { return solidT(tileAt(Math.floor(px / TS), Math.floor(py / TS))); }
function rectSolid(x, y, w, h) {
  var x0 = Math.floor(x / TS), x1 = Math.floor((x + w - 0.01) / TS), y0 = Math.floor(y / TS), y1 = Math.floor((y + h - 0.01) / TS);
  for (var ty = y0; ty <= y1; ty++) for (var tx = x0; tx <= x1; tx++) if (solidT(tileAt(tx, ty))) return true;
  return false;
}
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function addParticles(x, y, color, n, size) {
  for (var i = 0; i < n; i++) particles.push({ x: x, y: y, vx: (Math.random() - .5) * 4, vy: -Math.random() * 4 - 1, life: 30 + Math.random() * 15, c: color, s: size || 3, max: 45 });
}
function dust(x, y, n) {
  for (var i = 0; i < n; i++) particles.push({ x: x + (Math.random() - .5) * 10, y: y, vx: (Math.random() - .5) * 1.6, vy: -Math.random() * 1.2, life: 16 + Math.random() * 8, c: 'rgba(235,220,190,.8)', s: 4, max: 24, soft: true });
}
function popup(x, y, text) { popups.push({ x: x, y: y, t: 50, text: text }); }
function groundBelow(x, y) {
  for (var ty = Math.max(0, Math.floor(y / TS)); ty < ROWS; ty++) if (solidT(tileAt(Math.floor(x / TS), ty))) return ty * TS;
  return null;
}

/* ---------- Power-ups ---------- */
function spawnItem(tx, ty, kind) {
  L.items.push({ x: tx * TS + 5, y: ty * TS + 6, w: 22, h: 22, vx: (kind === 'g' || kind === 'c') ? 1.3 : 1.8, vy: 0, kind: kind, emerge: 28, dead: false });
}
function grow() {
  if (P.big && !P.pow) { P.pow = true; sfx.power(); popup(P.x - 22, P.y - 8, 'CESTA! APERTE B'); score += 300; addParticles(P.x + 10, P.y + 20, '#7dffa0', 14); return; }
  if (P.big) {
    if (P.hearts < 3) { P.hearts++; popup(P.x, P.y - 8, '+1 CORAÇÃO'); sfx.grow(); } else { score += 1000; popup(P.x, P.y - 8, '+1000'); sfx.coin(); }
    return;
  }
  if (!rectSolid(P.x, P.y - 14, P.w, 14)) { P.big = true; P.h = 44; P.y -= 14; sfx.grow(); popup(P.x - 10, P.y - 8, 'CRESCEU!'); score += 200; addParticles(P.x + 10, P.y + 20, '#ffd400', 12); }
  else { score += 1000; sfx.coin(); popup(P.x, P.y - 8, '+1000'); }
}
function shrink() { P.big = false; P.pow = false; P.h = 30; P.y += 14; }

function updateItems() {
  L.items.forEach(function (it) {
    if (it.emerge > 0) { it.y -= 1; it.emerge--; }
    else {
      it.vy = Math.min(it.vy + 0.5, 10);
      it.x += it.vx;
      var front = it.vx > 0 ? it.x + it.w + 0.5 : it.x - 0.5;
      if (solidAt(front, it.y + it.h / 2) || front < 0) it.vx = -it.vx;
      it.y += it.vy;
      if (it.vy >= 0 && (solidAt(it.x + it.w / 2, it.y + it.h) || solidAt(it.x + 2, it.y + it.h) || solidAt(it.x + it.w - 2, it.y + it.h))) {
        it.y = Math.floor((it.y + it.h) / TS) * TS - it.h; it.vy = it.kind === 's' ? -8 : 0;
      }
      if (it.y > VH + 50) it.dead = true;
    }
    if (!it.dead && !P.dead && overlap(P, it)) {
      it.dead = true;
      if (it.kind === 'g' || it.kind === 'c') grow();
      else { P.star = 600; score += 500; sfx.power(); popup(P.x - 10, P.y - 8, 'IMUNE!'); addParticles(P.x + 10, P.y + 15, '#fff08a', 14); }
    }
  });
  L.items = L.items.filter(function (it) { return !it.dead; });
}

/* ---------- Jogador ---------- */
function bump(tx, ty) {
  var t = L.grid[ty][tx];
  if (t === 4) {
    L.grid[ty][tx] = 5; bumps[ty * L.w + tx] = 10; coinCount++; score += 50; sfx.coin();
    popup(tx * TS + 8, ty * TS - 6, '+50'); addParticles(tx * TS + 16, ty * TS, '#ffd400', 6);
  } else if (t === 8 || t === 9) {
    L.grid[ty][tx] = 5; bumps[ty * L.w + tx] = 10; sfx.bump(); spawnItem(tx, ty, t === 8 ? (P.big ? 'c' : 'g') : 's');
  } else if (t === 3) {
    if (P.big) { L.grid[ty][tx] = 0; score += 20; sfx.bump(); addParticles(tx * TS + 16, ty * TS + 16, '#b0703a', 10, 4); }
    else { bumps[ty * L.w + tx] = 10; sfx.bump(); addParticles(tx * TS + 16, ty * TS + 4, '#b0703a', 3); }
  }
}
function hurt() {
  if (P.inv > 0 || P.dead || P.star > 0) return;
  if (P.pow) { P.pow = false; P.inv = 100; P.vy = -5; sfx.hurt(); popup(P.x - 14, P.y - 8, 'PERDEU A CESTA'); return; }
  if (P.big) { shrink(); P.inv = 100; P.vy = -5; sfx.hurt(); return; }
  P.hearts--; P.inv = 75; sfx.hurt();
  if (P.hearts <= 0) { die(); return; }
  P.vy = -6; P.vx = -P.dir * 4;
}
function die() {
  if (P.dead) return;
  P.dead = true; P.vy = -9; P.vx = 0; sfx.die(); state = 'dying'; P.t = 0;
}
function respawn() {
  var li = levelIdx;
  if (L.boss || !L.cp) { loadLevel(li); }
  else {
    var cx = L.cp; P = newPlayer(); L.proj = []; L.items = []; L.veg = [];
    placeAtCheckpoint(cx); timeLeft = Math.max(timeLeft, 45); particles = []; popups = [];
    L.enemies.forEach(function (e) { if (!e.dead && Math.abs(e.x - cx) < 160) e.dead = 30; });
  }
  state = 'play';
}
function finishDeath() {
  lives--;
  if (lives < 0) {
    saveBest(); state = 'over';
    var sv = readSave();
    show('Fim de jogo', ['Pontos: ' + score + ' · Brigadeiros: ' + coinCount], sv ? 'Carregar jogo' : 'Tentar de novo', sv ? loadGame : retryLevel,
      score >= best && score > 0 ? 'Novo recorde!' : 'Recorde: ' + best, 'Menu', menu);
  } else respawn();
}

function vignette() {

  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.34)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
}

/* Cena final: o chapéu volta para a cabeça do Zeca */
function drawEnding() {
  var th = L.theme;
  var save = cam; cam = 0;
  drawBG(th);
  for (var ty = 9; ty < ROWS; ty++) for (var tx = 0; tx < 20; tx++) { if (L.grid[ty][tx]) drawTile(L.grid[ty][tx], tx * TS, ty * TS, th, tx, ty); }
  var zx = Math.min(300, 40 + endT * 1.9), walking = endT < 137;
  var hatOn = endT >= 215;
  var hop = endT >= 215 && endT < 260 ? Math.abs(Math.sin((endT - 215) / 45 * Math.PI * 2)) * 14 : 0;
  var hx, hy;
  if (endT < 150) { hx = 420; hy = 150 + Math.sin(endT * 0.07) * 6; }
  else if (endT < 215) { var k = (endT - 150) / 65, e = k * k * (3 - 2 * k); hx = 420 + (300 - 420) * e; hy = 150 + (GROUND - 56 - 150) * e - Math.sin(k * Math.PI) * 40; }
  else { hx = 300; hy = GROUND - 56; }
  if (!hatOn) {
    var hg = ctx.createRadialGradient(hx, hy, 4, hx, hy, 46); hg.addColorStop(0, 'rgba(255,240,150,.9)'); hg.addColorStop(1, 'rgba(255,240,150,0)');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(hx, hy, 46, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(hx, hy); ctx.scale(1.3, 1.3);
    part(-8, -8, 16, 8, 4, '#f2cf6a'); ctx.fillStyle = '#c0392b'; ctx.fillRect(-8, -3, 16, 2.5); part(-14, -2, 28, 3.5, 1.7, '#e8b84a');
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(zx, GROUND + 1, 11, 3, 0, 0, 7); ctx.fill();
  drawZeca(zx, GROUND - 30 - hop, { dir: 1, anim: endT * 0.09 * 3.4, air: hop > 0, moving: walking, big: false, sx: 1, sy: 1, hat: hatOn });
  particles.forEach(function (p) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 25)); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s); });
  ctx.globalAlpha = 1;
  if (endT > 225) {
    ctx.globalAlpha = Math.min(1, (endT - 225) / 40);
    ctx.font = '22px ' + HUDFONT; txt('ZECA RECUPEROU O CHAPÉU!', VW / 2, 110, '#ffd400', 'center');
    ctx.globalAlpha = 1;
  }
  cam = save;
  vignette();
}

function draw() {
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  if (!L) { ctx.fillStyle = '#4fb8ff'; ctx.fillRect(0, 0, VW, VH); return; }
  if (state === 'ending' || state === 'end') { drawEnding(); return; }
  var th = L.theme;
  ctx.save();
  if (shakeT > 0) ctx.translate((Math.random() - .5) * shakeT * 0.5, (Math.random() - .5) * shakeT * 0.5);
  drawBG(th);
  var c0 = Math.floor(cam / TS), c1 = Math.min(L.w - 1, c0 + Math.ceil(VW / TS) + 1);
  ctx.textAlign = 'center';
  for (var ty = 0; ty < ROWS; ty++) for (var tx = c0; tx <= c1; tx++) {
    var t = L.grid[ty][tx]; if (t) drawTile(t, Math.round(tx * TS - cam), ty * TS, th, tx, ty);
  }
  drawChecks();
  drawGoal();
  L.coins.forEach(function (c) { if (!c.got && c.x - cam > -20 && c.x - cam < VW + 20) drawCoin(c); });
  L.items.forEach(function (it) { drawItem(it); });
  L.enemies.forEach(function (e) { if (e.x - cam > -60 && e.x - cam < VW + 60) drawEnemy(e); });
  if (L.boss) drawBoss(L.boss);
  L.proj.forEach(drawProj);
  L.veg.forEach(drawVeg);
  drawPlayer();
  particles.forEach(function (p) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / (p.max * 0.6)));
    ctx.fillStyle = p.c;
    if (p.soft) { ctx.beginPath(); ctx.arc(p.x - cam, p.y, p.s * (1.4 - p.life / p.max * 0.6), 0, 7); ctx.fill(); }
    else ctx.fillRect(Math.round(p.x - cam), Math.round(p.y), p.s, p.s);
  });
  ctx.globalAlpha = 1;
  ctx.font = '12px ' + HUDFONT; ctx.textAlign = 'center';
  popups.forEach(function (p) { ctx.globalAlpha = Math.min(1, p.t / 20); txt(p.text, p.x - cam + 10, p.y, '#fff', 'center'); });
  ctx.globalAlpha = 1;
  ctx.restore();
  vignette();
  if (state !== 'menu') drawHUD();
}

/* ---------- Loop ---------- */
function desiredTrack() {
  if (state === 'menu') return 'menu';
  if (state === 'play') { var d = LEVELS[levelIdx]; return d.boss ? 'boss' : ['am', 'se', 'ri'][d.island]; }
  if (state === 'ending' || state === 'end') return 'ending';
  return null;
}
var last = performance.now(), acc2 = 0;
function loop(now) {
  acc2 += Math.min(now - last, 100); last = now;
  while (acc2 >= 1000 / 60) { update(); acc2 -= 1000 / 60; }
  setTrack(desiredTrack());
  draw();
  requestAnimationFrame(loop);
}
if (window.__ZECA_TEST) window.__ZECA_TEST({ LEVELS: LEVELS, loadLevel: loadLevel, update: update, draw: draw, keys: keys, getP: function () { return P; }, getL: function () { return L; }, setState: function (s) { state = s; }, getState: function () { return state; }, hitBoss: hitBoss, loadGame: loadGame, saveGame: saveGame, startEnding: startEnding, getEnd: function () { return endT; }, nextLevel: nextLevel, setTrack: setTrack });
loadLevel(0); state = 'menu';
draw();
menu();
try { if (document.fonts && document.fonts.load) document.fonts.load("13px 'Bungee'"); } catch (e) {}
requestAnimationFrame(loop);
})();
</script>
