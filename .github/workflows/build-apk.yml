name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK de debug
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: corre-zeca-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK na pasta apk-download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/CorreZeca.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk-download
          git rm -rf . -q
          cp /tmp/CorreZeca.apk CorreZeca.apk
          git add CorreZeca.apk
          git commit -m "APK compilado"
          git push -f origin apk-download
